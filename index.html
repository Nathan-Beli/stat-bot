<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Interface Stats</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .card { 
            background: white; 
            max-width: 400px; 
            margin: auto; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .stat-item { margin: 10px 0; display: flex; justify-content: space-between; }
        .label { font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="card">
    <h2>Statistiques ERLC</h2>
    <div class="stat-item">
        <span class="label">Pompier XP:</span>
        <span>3720 / 18000</span>
    </div>
    <div class="stat-item">
        <span class="label">Police XP:</span>
        <span>10538 / 20000</span>
    </div>
    <div class="stat-item">
        <span class="label">Total Prix:</span>
        <span>15 784 551 $</span>
    </div>
</div>

</body>
</html>
